name: Assistant eval (live)

# Manual only: Actions -> "Assistant eval (live)" -> Run workflow (D-047).
# suite owner: the owner assistant's set in workers/assistant/evals/cases.json.
# suite visitor: the visitor assistant's set in evals/visitor-cases.json, with its cost per chat; with record, the
# recorded replies are uploaded as the artifact visitor-eval-recording.
# Runs against the real model and spends real money (one short turn per case). PR CI replays recorded replies instead.
# Needs: secret ANTHROPIC_API_KEY; optional variable AI_GATEWAY_URL, secret AI_GATEWAY_TOKEN.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which assistant's eval set to run
        type: choice
        options: [owner, visitor]
        default: owner
      record:
        description: Also record the model's replies (visitor suite: uploaded as an artifact)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
    steps:
      - name: Check the model key
        run: '[ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Set the ANTHROPIC_API_KEY secret first"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the eval
        env:
          SUITE: ${{ inputs.suite }}
          RECORD: ${{ inputs.record }}
        run: |
          set -o pipefail
          script=eval:live
          [ "$SUITE" = visitor ] && script=eval:visitor
          args=""
          [ "$RECORD" = true ] && args="-- --record"
          pnpm --filter @studio/assistant "$script" $args 2>&1 | tee eval-output.txt
      - name: Job summary
        if: always()
        run: |
          { echo "## Assistant eval: ${{ inputs.suite }}"; echo '```'; cat eval-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the recording
        if: always() && inputs.suite == 'visitor' && inputs.record
        uses: actions/upload-artifact@v4
        with:
          name: visitor-eval-recording
          path: workers/assistant/evals/visitor-cases.recorded.json
          if-no-files-found: warn
