name: CI

# Typecheck and test on every push. Nothing deploys from here until Isaac
# approves the staging/production resources (docs/phase-1.md, "Needs Isaac's OK").
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Show Tracker's SDK bundle builds
        run: pnpm --filter @studio/show-tracker build
      - name: docs/openapi.json matches the code
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json

  # Two real browser profiles against a real local studio-api: the Phase 2
  # gate (airplane mode, sale, reconnect, second device), conflicts, and an
  # edit made while a pull is in flight. Separate job so a browser problem
  # doesn't hide a typecheck/test result.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studio/show-tracker build
      - run: pnpm --filter @studio/show-tracker exec playwright-core install --with-deps chromium
      - run: pnpm --filter @studio/show-tracker e2e
      # Again, in the deployed shape: the tracker Worker serving dist/ with studio-api behind a service binding.
      - run: pnpm --filter @studio/show-tracker stage
      - run: pnpm --filter @studio/show-tracker e2e
        env:
          E2E_WORKER: "1"
