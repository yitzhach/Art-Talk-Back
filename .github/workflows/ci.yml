name: CI

# Typecheck and test on every push. Nothing deploys from here; staging is the
# manual deploy-staging.yml, and production waits until Isaac
# approves the staging/production resources (docs/phase-1.md, "Needs Isaac's OK").
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: tracker/studio-sdk.js matches the SDK source
        run: pnpm --filter @studio/show-tracker bundle:check
      - name: docs/openapi.json matches the code
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json

  # The Show Tracker: its own suites, then the phase-2 two-device gate in a real
  # browser against wrangler dev (apps/show-tracker/e2e). Its suites were written
  # for a sandbox with no internet (weather asserts the failure path), so
  # Chromium is pointed at a dead proxy here; loopback still bypasses it.
  show-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HTTPS_PROXY: http://127.0.0.1:9
      HTTP_PROXY: http://127.0.0.1:9
      https_proxy: http://127.0.0.1:9
      http_proxy: http://127.0.0.1:9
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          https_proxy: ""
          http_proxy: ""
      - name: Chromium for Playwright
        run: pnpm --filter @studio/show-tracker exec playwright install --with-deps chromium
        env:
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          https_proxy: ""
          http_proxy: ""
      - name: The tracker's own suites
        working-directory: apps/show-tracker
        run: node build/run-suites.cjs
      - name: Two devices, offline (phase-2 gate 1-3)
        working-directory: apps/show-tracker
        run: node e2e/two-devices.cjs
