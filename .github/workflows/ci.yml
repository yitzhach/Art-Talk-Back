name: CI

# Typecheck and test on every push. Nothing deploys from here; staging is the
# manual deploy-staging.yml, and production waits until Isaac
# approves the staging/production resources (docs/phase-1.md, "Needs Isaac's OK").
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: docs/openapi.json matches the code
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json

  # The Show Tracker lives in yitzhach/art-show-tracker (D-042). From here, check
  # that this SDK still matches the copy the app ships (its main, or its branch of
  # the same name, D-056), and that this API still
  # passes its two-device offline run (an API change that breaks the live app
  # fails here). Its own suites run in its repo. Test steps point Chromium at a
  # dead proxy (the suites assume no internet); loopback bypasses it.
  show-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # A change that spans both repos sits on a branch of the same name in each (D-056):
      # test this branch against that app branch, else against the app's main.
      - name: Pick the app branch
        id: app
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/yitzhach/art-show-tracker "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Testing against art-show-tracker@$(grep -o 'ref=.*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
      - uses: actions/checkout@v4
        with:
          repository: yitzhach/art-show-tracker
          ref: ${{ steps.app.outputs.ref }}
          path: .show-tracker
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The app's studio-sdk.js matches this SDK
        run: pnpm --filter @studio/sdk bundle:classic --check --out "$GITHUB_WORKSPACE/.show-tracker/tracker/studio-sdk.js"
      - name: Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Two devices, offline, against this API
        working-directory: .show-tracker
        env: { HTTPS_PROXY: "http://127.0.0.1:9", HTTP_PROXY: "http://127.0.0.1:9", NO_PROXY: "127.0.0.1,localhost", STUDIO_PLATFORM: ".." }
        run: node e2e/two-devices.cjs
