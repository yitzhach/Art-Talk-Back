name: CI

# Typecheck and test on every push. Nothing deploys from here; staging is the
# manual deploy-staging.yml, and production waits until Isaac
# approves the staging/production resources (docs/phase-1.md, "Needs Isaac's OK").
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: docs/openapi.json matches the code
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json

  # The Show Tracker lives in yitzhach/art-show-tracker (D-042). From here, check
  # that this SDK still matches the copy the app ships (its main, or its branch of
  # the same name, D-056), and that this API still
  # passes its two-device offline run (an API change that breaks the live app
  # fails here). Its own suites run in its repo. Test steps point Chromium at a
  # dead proxy (the suites assume no internet); loopback bypasses it.
  show-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # A change that spans both repos sits on a branch of the same name in each (D-056):
      # test this branch against that app branch, else against the app's main.
      - name: Pick the app branch
        id: app
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/yitzhach/art-show-tracker "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Testing against art-show-tracker@$(grep -o 'ref=.*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
      - uses: actions/checkout@v4
        with:
          repository: yitzhach/art-show-tracker
          ref: ${{ steps.app.outputs.ref }}
          path: .show-tracker
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The app's studio-sdk.js matches this SDK
        run: pnpm --filter @studio/sdk bundle:classic --check --out "$GITHUB_WORKSPACE/.show-tracker/tracker/studio-sdk.js"
      - name: Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Two devices, offline, against this API
        working-directory: .show-tracker
        env: { HTTPS_PROXY: "http://127.0.0.1:9", HTTP_PROXY: "http://127.0.0.1:9", NO_PROXY: "127.0.0.1,localhost", STUDIO_PLATFORM: ".." }
        run: node e2e/two-devices.cjs

  # Booth Studio lives in yitzhach/booth-studio (D-042, phase-5-booth.md). From
  # here: its vendored ES-module SDK still matches this SDK, and this API still
  # passes its two-device run (images, offline edits, conflicts, import). Its
  # branch of the same name, else its main (D-056). Until Booth Studio's main is
  # on the platform (no tests/two-devices.mjs there yet), the job says so and
  # passes: this API's changes can't break an app that doesn't call it.
  booth-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pick the app branch
        id: app
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/yitzhach/booth-studio "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Testing against booth-studio@$(grep -o 'ref=.*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
      - uses: actions/checkout@v4
        with:
          repository: yitzhach/booth-studio
          ref: ${{ steps.app.outputs.ref }}
          path: .booth-studio
      - name: Is this Booth Studio on the platform?
        id: on
        run: |
          if [ -f .booth-studio/tests/two-devices.mjs ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::booth-studio@${{ steps.app.outputs.ref }} doesn't use the studio yet: nothing to test"; fi
      - uses: pnpm/action-setup@v4
        if: steps.on.outputs.yes == 'true'
      - uses: actions/setup-node@v4
        if: steps.on.outputs.yes == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.on.outputs.yes == 'true'
      - name: The app's src/vendor/studio-sdk.js matches this SDK
        if: steps.on.outputs.yes == 'true'
        run: pnpm --filter @studio/sdk bundle:esm --check --out "$GITHUB_WORKSPACE/.booth-studio/src/vendor/studio-sdk.js"
      - name: Build Booth Studio
        if: steps.on.outputs.yes == 'true'
        working-directory: .booth-studio
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: workers/studio-api/src/vendor/booth-scene.js is this app's scene build (D-070)
        if: steps.on.outputs.yes == 'true'
        working-directory: .booth-studio
        run: |
          if ! grep -q '"bundle:scene"' package.json; then echo "::notice::booth-studio@${{ steps.app.outputs.ref }} has no scene build yet"; exit 0; fi
          npm run -s bundle:scene
          cmp dist-scene/booth-scene.js "$GITHUB_WORKSPACE/workers/studio-api/src/vendor/booth-scene.js" || {
            echo "::error::workers/studio-api/src/vendor/booth-scene.js differs from booth-studio's npm run bundle:scene: copy its dist-scene/booth-scene.js over it"; exit 1; }
      - name: Two devices, offline, against this API
        if: steps.on.outputs.yes == 'true'
        working-directory: .booth-studio
        env: { HTTPS_PROXY: "http://127.0.0.1:9", HTTP_PROXY: "http://127.0.0.1:9", NO_PROXY: "127.0.0.1,localhost", STUDIO_PLATFORM: ".." }
        run: node tests/two-devices.mjs
