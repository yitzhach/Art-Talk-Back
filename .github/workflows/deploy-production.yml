name: Deploy production API

# Runs by itself after CI passes on the default branch (D-057): a merged pull
# request deploys studio-api with no clicks. Still runnable by hand: Actions tab
# -> "Deploy production API" -> Run workflow, type studio-api to confirm.
# Deploys the Worker `studio-api` on studio-db-prod + iaa-files (D-030, D-043).
# Before migrating, it saves a database restore point (D1 Time Travel bookmark)
# and the live Worker version to the run summary; "Roll back production" uses
# them (docs/SHIPPING.md). Same secrets and variables as "Deploy staging".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type studio-api to deploy production'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # By hand: only with the confirm word. Automatic: only for a green CI run
    # on a push to the default branch (never a pull request or other branch).
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'studio-api') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    defaults:
      run:
        working-directory: workers/studio-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OWNER_EMAILS: ${{ vars.OWNER_EMAILS }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      - name: Check required secrets and variables
        working-directory: .
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY OWNER_EMAILS MAIL_FROM; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing (see the header of this workflow)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Automatic runs deploy exactly the commit CI passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
        working-directory: .
      - run: pnpm test
        working-directory: .
      - name: Save restore points (database bookmark + live Worker version)
        run: |
          bookmark=$(pnpm exec wrangler d1 time-travel info DB --env production --json | node -e 'const b=JSON.parse(require("fs").readFileSync(0)).bookmark; if (!b) throw new Error("no bookmark: not migrating"); console.log(b)')
          version=$(pnpm exec wrangler deployments list --env production --json | node -pe 'const d=JSON.parse(require("fs").readFileSync(0)); (d.at(-1)?.versions?.[0]?.version_id) ?? "none"')
          {
            echo "### Restore points (before this deploy)"
            echo "- Database bookmark: \`$bookmark\`"
            echo "- Worker version: \`$version\`"
            echo "To undo: Actions -> Roll back production, paste these (docs/SHIPPING.md)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations to studio-db-prod
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
      - name: Deploy studio-api
        run: >
          pnpm exec wrangler deploy --env production
          --var "OWNER_EMAILS:$OWNER_EMAILS"
          --var "MAIL_FROM:$MAIL_FROM"
      - name: Set SIGNING_KEY once (never overwritten, it signs file links)
        run: |
          if pnpm exec wrangler secret list --env production | grep -q '"SIGNING_KEY"'; then
            echo "SIGNING_KEY already set"
          else
            openssl rand -hex 32 | pnpm exec wrangler secret put SIGNING_KEY --env production
          fi
      - name: Set RESEND_API_KEY
        run: printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --env production
