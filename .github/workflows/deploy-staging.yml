name: Deploy staging

# Manual only: Actions tab -> "Deploy staging" -> Run workflow.
# Needs (repo Settings -> Secrets and variables -> Actions):
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RESEND_API_KEY
#   variables: OWNER_EMAILS (comma-separated), MAIL_FROM (e.g. "Isaac Anderson Art <hello@yourdomain>")
# Optional, for the assistant (Phase 3; skipped until ANTHROPIC_API_KEY is set):
#   secrets:   ANTHROPIC_API_KEY, AI_GATEWAY_TOKEN (only if the gateway requires auth)
#   variables: AI_GATEWAY_URL (https://gateway.ai.cloudflare.com/v1/<account id>/<gateway>/anthropic)
# Deploys studio-api-staging, then the Show Tracker (yitzhach/art-show-tracker, branch
# `app_ref`) as studio-show-tracker-staging, then Booth Studio (yitzhach/booth-studio,
# branch `booth_ref`) as studio-booth-studio-staging (D-067).
# Production is not deployed from here (docs/phase-2.md, step 8).
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "art-show-tracker branch to deploy as studio-show-tracker-staging"
        default: main
      booth_ref:
        description: "booth-studio branch to deploy as studio-booth-studio-staging"
        default: main
      assistant_model:
        description: "Model for studio-assistant-staging (to compare models on staging)"
        type: choice
        default: claude-sonnet-5-5
        options: [claude-sonnet-5-5, claude-haiku-4-5]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/studio-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OWNER_EMAILS: ${{ vars.OWNER_EMAILS }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
      ASSISTANT_MODEL: ${{ inputs.assistant_model || 'claude-sonnet-5-5' }}
    steps:
      - name: Check required secrets and variables
        working-directory: .
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY OWNER_EMAILS MAIL_FROM; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing (see the header of this workflow)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
        working-directory: .
      - run: pnpm test
        working-directory: .
      - name: Apply migrations to studio-db-staging
        run: pnpm exec wrangler d1 migrations apply DB --remote --env staging
      - name: Deploy studio-api-staging
        run: >
          pnpm exec wrangler deploy --env staging
          --var "OWNER_EMAILS:$OWNER_EMAILS"
          --var "MAIL_FROM:$MAIL_FROM"
      - name: Set SIGNING_KEY once (never overwritten, it signs file links)
        run: |
          if pnpm exec wrangler secret list --env staging | grep -q '"SIGNING_KEY"'; then
            echo "SIGNING_KEY already set"
          else
            openssl rand -hex 32 | pnpm exec wrangler secret put SIGNING_KEY --env staging
          fi
      - name: Set RESEND_API_KEY
        run: printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --env staging
      # studio-assistant-staging (Phase 3), once there is a model key. Both Workers get
      # the same ASSISTANT_KEY, made here once and never shown (D-046).
      - name: Deploy studio-assistant-staging
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: workers/assistant
        run: |
          pnpm exec wrangler deploy --env staging --var "AI_GATEWAY_URL:$AI_GATEWAY_URL" --var "ASSISTANT_MODEL:$ASSISTANT_MODEL"
          echo "studio-assistant-staging runs $ASSISTANT_MODEL" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s' "$ANTHROPIC_API_KEY" | pnpm exec wrangler secret put ANTHROPIC_API_KEY --env staging
          if [ -n "$AI_GATEWAY_TOKEN" ]; then printf '%s' "$AI_GATEWAY_TOKEN" | pnpm exec wrangler secret put AI_GATEWAY_TOKEN --env staging; fi
      - name: Share ASSISTANT_KEY between studio-api-staging and studio-assistant-staging (once)
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: .
        run: |
          api=$(pnpm --dir workers/studio-api exec wrangler secret list --env staging | grep -c '"ASSISTANT_KEY"' || true)
          bot=$(pnpm --dir workers/assistant exec wrangler secret list --env staging | grep -c '"ASSISTANT_KEY"' || true)
          if [ "$api" = "1" ] && [ "$bot" = "1" ]; then echo "ASSISTANT_KEY already set on both"; exit 0; fi
          key=$(openssl rand -hex 32)
          printf '%s' "$key" | pnpm --dir workers/studio-api exec wrangler secret put ASSISTANT_KEY --env staging
          printf '%s' "$key" | pnpm --dir workers/assistant exec wrangler secret put ASSISTANT_KEY --env staging
      # The Show Tracker lives in its own repo (D-042). Its `staging` env is a new
      # Worker bound to studio-api-staging (D-041); its top level is the live
      # art-show-tracker, which only its own Git integration deploys.
      - uses: actions/checkout@v4
        with:
          repository: yitzhach/art-show-tracker
          ref: ${{ inputs.app_ref }}
          path: .show-tracker
      - name: Check the Show Tracker's SDK copy matches this SDK
        run: pnpm --filter @studio/sdk bundle:classic --check --out "$GITHUB_WORKSPACE/.show-tracker/tracker/studio-sdk.js"
        working-directory: .
      - name: Deploy studio-show-tracker-staging
        run: pnpm exec wrangler deploy --env staging -c "$GITHUB_WORKSPACE/.show-tracker/wrangler.toml"
      # Booth Studio lives in its own repo too (D-042). Its `staging` env is a new
      # Worker, studio-booth-studio-staging, bound to studio-api-staging (D-067); its
      # top level is the live booth-studio, which only its own Git integration deploys.
      # A branch whose wrangler.jsonc has no staging Worker isn't deployed at all.
      - uses: actions/checkout@v4
        with:
          repository: yitzhach/booth-studio
          ref: ${{ inputs.booth_ref }}
          path: .booth-studio
      - name: Is this Booth Studio on the platform?
        id: booth
        working-directory: .
        run: |
          if grep -q '"studio-booth-studio-staging"' .booth-studio/wrangler.jsonc; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::booth-studio@${{ inputs.booth_ref }} has no staging Worker: not deployed"; fi
      - name: Check Booth Studio's SDK copy matches this SDK
        if: steps.booth.outputs.yes == 'true'
        working-directory: .
        run: pnpm --filter @studio/sdk bundle:esm --check --out "$GITHUB_WORKSPACE/.booth-studio/src/vendor/studio-sdk.js"
      - name: Deploy studio-booth-studio-staging
        if: steps.booth.outputs.yes == 'true'
        working-directory: .booth-studio
        run: npm ci && npm run build && npx wrangler deploy --env staging
