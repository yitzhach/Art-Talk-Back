# studio-api — OpenAPI draft for the Phase 2 routes still to build.
#
# Phase 1 routes are generated from the code: see docs/openapi.json
# (`pnpm openapi`). As each Phase 2 route is built, it moves out of this file;
# the file is deleted when it's empty (D-013).
openapi: 3.1.0
info:
  title: Studio Platform API — Phase 2 draft
  version: 0.2.0-draft
  description: 'One versioned API for every studio app, the assistant and outside tools.

    Changes are additive only. The studio always comes from the session,

    never from the request body.

    '
servers:
- url: https://studio-api.{account}.workers.dev/v1
  variables:
    account:
      default: example
security:
- session: []
tags:
- name: records
  description: Plain CRUD on artworks, clients and shows
- name: sync
  description: Offline outbox push and change-feed pull
paths:
  /sync/push:
    post:
      tags:
      - sync
      operationId: sync.push
      x-phase: 2
      summary: Apply a device's outbox
      description: 'Each op runs through the same action function as a normal API call.

        op_id makes retries safe: a repeated op returns its original result.

        Ops are applied in order; one op''s failure does not stop the rest.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ops
              properties:
                ops:
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/SyncOp'
      responses:
        '200':
          description: One result per op, same order
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                - cursor
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncOpResult'
                  cursor:
                    type: string
  /sync/pull:
    get:
      tags:
      - sync
      operationId: sync.pull
      x-phase: 2
      summary: Every record changed since the cursor, deletions included
      parameters:
      - name: since
        in: query
        description: The cursor from the last pull ('0' for a first sync). It is activity_log.seq.
        schema:
          type: string
          default: '0'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Changes; call again with cursor while hasMore is true
          content:
            application/json:
              schema:
                type: object
                required:
                - changes
                - cursor
                - hasMore
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required:
                      - entityType
                      - entityId
                      - record
                      properties:
                        entityType:
                          type: string
                        entityId:
                          $ref: '#/components/schemas/Id'
                        record:
                          description: Current row; deleted_at is set for deletions
                          type: object
                          additionalProperties: true
                  cursor:
                    type: string
                  hasMore:
                    type: boolean
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: studio_session
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The record version the change was based on
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional ULID; a repeat with the same key returns the first result
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VersionConflict:
      description: The record moved on; details.current holds the server copy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Deleted:
      description: Soft-deleted; undo via the returned activity id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResult'
  schemas:
    Id:
      type: string
      description: ULID
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO-8601
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      default: USD
    SizeUnit:
      type: string
      enum:
      - in
      - cm
    ActorType:
      type: string
      enum:
      - user
      - assistant
      - system
      - api
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - bad_request
              - unauthenticated
              - forbidden
              - not_found
              - version_conflict
              - rate_limited
              - needs_confirmation
              - internal
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    RecordMeta:
      type: object
      required:
      - id
      - studioId
      - createdAt
      - updatedAt
      - actorType
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        studioId:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          type:
          - string
          - 'null'
        actorType:
          $ref: '#/components/schemas/ActorType'
        version:
          type: integer
          minimum: 1
        deletedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        meta:
          type: object
          additionalProperties: true
    Me:
      type: object
      required:
      - user
      - memberships
      properties:
        user:
          type: object
          required:
          - id
          - email
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
              format: email
            name:
              type:
              - string
              - 'null'
        memberships:
          type: array
          items:
            type: object
            required:
            - studioId
            - studioName
            - role
            properties:
              studioId:
                $ref: '#/components/schemas/Id'
              studioName:
                type: string
              role:
                type: string
                enum:
                - owner
                - staff
                - client
              clientId:
                type:
                - string
                - 'null'
        activeStudioId:
          type:
          - string
          - 'null'
    StudioSettingsPatch:
      type: object
      minProperties: 1
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        paymentTermsDays:
          type: integer
          minimum: 0
        depositBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: 5000 = 50%
        taxRateBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: 825 = 8.25%
        sizeUnit:
          $ref: '#/components/schemas/SizeUnit'
        timezone:
          type: string
          example: America/New_York
        emailTone:
          type:
          - string
          - 'null'
        signature:
          type:
          - string
          - 'null'
    StudioSettings:
      allOf:
      - $ref: '#/components/schemas/StudioSettingsPatch'
      - type: object
        required:
        - studioId
        - version
        - currency
        - paymentTermsDays
        - depositBps
        - taxRateBps
        - sizeUnit
        - timezone
        properties:
          studioId:
            $ref: '#/components/schemas/Id'
          version:
            type: integer
    ArtworkStatus:
      type: string
      enum:
      - available
      - reserved
      - sold
      - not_for_sale
      - archived
    ArtworkPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        inventoryCode:
          type:
          - string
          - 'null'
        medium:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        width:
          type:
          - number
          - 'null'
          minimum: 0
        height:
          type:
          - number
          - 'null'
          minimum: 0
        depth:
          type:
          - number
          - 'null'
          minimum: 0
        sizeUnit:
          $ref: '#/components/schemas/SizeUnit'
        priceCents:
          type:
          - integer
          - 'null'
          minimum: 0
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/ArtworkStatus'
        description:
          type:
          - string
          - 'null'
        primaryFileId:
          type:
          - string
          - 'null'
        meta:
          type: object
          additionalProperties: true
    ArtworkInput:
      allOf:
      - $ref: '#/components/schemas/ArtworkPatch'
      - type: object
        required:
        - title
        properties:
          id:
            $ref: '#/components/schemas/Id'
            description: Client may supply the ULID (offline create)
    Artwork:
      allOf:
      - $ref: '#/components/schemas/RecordMeta'
      - $ref: '#/components/schemas/ArtworkPatch'
    ArtworkPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artwork'
        nextCursor:
          type:
          - string
          - 'null'
    ClientPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
          - collector
          - gallery
          - business
          - other
        email:
          type:
          - string
          - 'null'
          format: email
        phone:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        notifyEmail:
          type: boolean
        notifySms:
          type: boolean
        meta:
          type: object
          additionalProperties: true
    ClientInput:
      allOf:
      - $ref: '#/components/schemas/ClientPatch'
      - type: object
        required:
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
    Client:
      allOf:
      - $ref: '#/components/schemas/RecordMeta'
      - $ref: '#/components/schemas/ClientPatch'
    ClientPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        nextCursor:
          type:
          - string
          - 'null'
    ShowPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        venue:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        startsOn:
          type:
          - string
          - 'null'
          format: date
        endsOn:
          type:
          - string
          - 'null'
          format: date
        booth:
          type:
          - string
          - 'null'
        feeCents:
          type:
          - integer
          - 'null'
          minimum: 0
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum:
          - planned
          - applied
          - accepted
          - declined
          - done
          - cancelled
        notes:
          type:
          - string
          - 'null'
        meta:
          type: object
          additionalProperties: true
    ShowInput:
      allOf:
      - $ref: '#/components/schemas/ShowPatch'
      - type: object
        required:
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
    Show:
      allOf:
      - $ref: '#/components/schemas/RecordMeta'
      - $ref: '#/components/schemas/ShowPatch'
    ShowDetail:
      allOf:
      - $ref: '#/components/schemas/Show'
      - type: object
        required:
        - artworks
        properties:
          artworks:
            type: array
            items:
              type: object
              required:
              - artworkId
              - outcome
              properties:
                artworkId:
                  $ref: '#/components/schemas/Id'
                outcome:
                  type: string
                  enum:
                  - brought
                  - sold
                  - returned
                soldPriceCents:
                  type:
                  - integer
                  - 'null'
                clientId:
                  type:
                  - string
                  - 'null'
    ShowPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Show'
        nextCursor:
          type:
          - string
          - 'null'
    FileKind:
      type: string
      enum:
      - photo
      - reference
      - agreement
      - coa
      - receipt
      - document
      - other
      default: other
    File:
      allOf:
      - $ref: '#/components/schemas/RecordMeta'
      - type: object
        required:
        - name
        - kind
        - status
        properties:
          name:
            type: string
          contentType:
            type:
            - string
            - 'null'
          size:
            type:
            - integer
            - 'null'
          kind:
            $ref: '#/components/schemas/FileKind'
          status:
            type: string
            enum:
            - pending
            - ready
          entityType:
            type:
            - string
            - 'null'
          entityId:
            type:
            - string
            - 'null'
          locked:
            type: boolean
    Activity:
      type: object
      required:
      - id
      - actorType
      - source
      - action
      - entityType
      - entityId
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actorId:
          type:
          - string
          - 'null'
        actorType:
          $ref: '#/components/schemas/ActorType'
        source:
          type: string
          enum:
          - app
          - assistant
          - job
          - api_key
          - sync
          - system
        action:
          type: string
          example: artwork.update
        entityType:
          type: string
        entityId:
          $ref: '#/components/schemas/Id'
        before:
          type:
          - object
          - 'null'
          additionalProperties: true
        after:
          type:
          - object
          - 'null'
          additionalProperties: true
        undoOf:
          type:
          - string
          - 'null'
        undoneAt:
          type:
          - string
          - 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ActionResult:
      type: object
      required:
      - ok
      - activityIds
      properties:
        ok:
          type: boolean
        result:
          type: object
          additionalProperties: true
        activityIds:
          type: array
          description: Log entries written; pass any to /activity/{id}/undo
          items:
            $ref: '#/components/schemas/Id'
    SyncOp:
      type: object
      required:
      - opId
      - action
      - entityId
      - input
      properties:
        opId:
          $ref: '#/components/schemas/Id'
        action:
          type: string
          example: artwork.update
        entityId:
          $ref: '#/components/schemas/Id'
        baseVersion:
          type:
          - integer
          - 'null'
          description: Version the device edited from; null for creates
        input:
          type: object
          additionalProperties: true
    SyncOpResult:
      type: object
      required:
      - opId
      - status
      properties:
        opId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - applied
          - merged
          - conflict
          - rejected
          - duplicate
          description: "merged   — different fields changed; server merged both.\nconflict — same field\
            \ changed on two devices, or a money/status field;\n           server kept its value, app\
            \ shows a \"review change\" card.\n"
        record:
          type: object
          additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            required:
            - field
            - serverValue
            - deviceValue
            properties:
              field:
                type: string
              serverValue: {}
              deviceValue: {}
        error:
          $ref: '#/components/schemas/Error'
